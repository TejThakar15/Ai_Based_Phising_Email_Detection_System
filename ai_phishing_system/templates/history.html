{% extends 'base.html' %}{% block content %}<h2>Detection History</h2><div class="table-responsive"><table class="table table-striped"><tr><th>Date</th><th>Subject</th><th>Prediction</th><th>Confidence</th><th>Email</th></tr>{% for r in rows %}<tr><td>{{r.created_at}}</td><td>{{r.subject}}</td><td>{{r.prediction}}</td><td>{{r.confidence}}%</td><td class="small">{{r.email_text[:180]}}{% if r.email_text|length>180 %}...{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
