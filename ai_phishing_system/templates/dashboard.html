{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-4"><div><h2>Detection Dashboard</h2><p class="text-muted">Welcome, {{session.username}}</p></div><a href="{{url_for('history')}}" class="btn btn-outline-primary">Full History</a></div><div class="card p-4 mb-4"><form method="post" action="{{url_for('analyze_email')}}"><input class="form-control mb-3" name="subject" placeholder="Email subject"><textarea class="form-control mb-3" name="email_text" rows="10" placeholder="Paste the email content here..." required></textarea><button class="btn btn-primary">Analyze Email</button></form></div><h4>Recent Detections</h4><div class="table-responsive"><table class="table table-striped"><tr><th>Date</th><th>Subject</th><th>Prediction</th><th>Confidence</th></tr>{% for r in rows %}<tr><td>{{r.created_at}}</td><td>{{r.subject}}</td><td><span class="badge {% if r.prediction=='Phishing' %}bg-danger{% else %}bg-success{% endif %}">{{r.prediction}}</span></td><td>{{r.confidence}}%</td></tr>{% endfor %}</table></div>{% endblock %}
